<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>今月のセイムタイプ診断｜FUJI Wellness Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1830;
    --navy-2:#0F2448;
    --line:rgba(120,190,210,.35);
    --teal:#4ED6E6;
    --gold:#F2C15A;
    --rose:#E58BE0;
    --ink:#F0F4FA;
    --mute:#AAB8CC;
    --card:rgba(255,255,255,.035);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(70% 45% at 50% 38%, rgba(20,80,110,.45), transparent 70%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 50%, var(--navy) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    min-height:100%;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px 32px;flex:1;display:flex;flex-direction:column}

  /* ---- top bar ---- */
  .bar{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:18px 0 14px;border-bottom:1.5px solid var(--line);
    font-size:13px;color:var(--mute);letter-spacing:.02em;
  }
  .bar strong{color:var(--ink);font-weight:500;font-size:14px}

  /* ---- heading ---- */
  .head{text-align:center;padding:32px 0 22px}
  .kicker{
    display:inline-flex;align-items:center;gap:14px;
    color:var(--teal);font-size:14px;letter-spacing:.06em;
  }
  .kicker i{width:20px;height:16px;position:relative;display:inline-block}
  .kicker i::before,.kicker i::after{
    content:"";position:absolute;width:2px;height:15px;background:var(--teal);border-radius:1px;top:0;
  }
  .kicker i.l::before{left:2px;transform:rotate(-30deg)}
  .kicker i.l::after{left:12px;transform:rotate(-30deg);height:11px;top:5px}
  .kicker i.r::before{right:2px;transform:rotate(30deg)}
  .kicker i.r::after{right:12px;transform:rotate(30deg);height:11px;top:5px}
  h1{
    font-family:"Noto Serif JP",serif;font-weight:600;
    font-size:clamp(24px,6.4vw,38px);letter-spacing:.04em;line-height:1.3;margin-top:10px;white-space:nowrap;
  }
  .rule{width:64px;height:2px;background:var(--teal);margin:14px auto 0;border-radius:1px}
  .q{margin-top:18px;font-size:16px;line-height:1.75}
  .q b{color:var(--teal);font-weight:500;margin-right:6px}
  .nw{white-space:nowrap}
  .q small{display:block;color:var(--mute);font-size:13px;margin-top:4px}

  /* ---- choices ---- */
  .choices{display:grid;gap:14px;margin-top:6px}
  .choice{
    appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:16px;padding:18px 18px 18px 16px;text-align:left;width:100%;
    display:grid;grid-template-columns:44px 64px 1fr;align-items:center;gap:12px;
    cursor:pointer;transition:border-color .18s,background .18s,transform .12s;
    font:inherit;
  }
  .choice:active{transform:scale(.985)}
  .choice:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .choice.on{background:rgba(78,214,230,.08);border-color:var(--teal)}
  .choice[data-c="A"] .tag{color:var(--gold);border-color:var(--gold)}
  .choice[data-c="B"] .tag{color:var(--rose);border-color:var(--rose)}
  .tag{
    width:44px;height:44px;border:1.5px solid;border-radius:50%;
    display:grid;place-items:center;font-weight:700;font-size:22px;line-height:1;
    background:rgba(10,24,48,.6);
  }
  .glyph{width:64px;height:64px;display:block}
  .name,.desc{display:block}
  .name{font-size:19px;font-weight:700;letter-spacing:.04em}
  .desc{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.55}

  /* ---- confirm ---- */
  .confirm{
    margin-top:18px;display:none;gap:10px;grid-template-columns:2fr 3fr;
  }
  .confirm.show{display:grid}
  .btn{
    appearance:none;border:1px solid var(--line);border-radius:999px;padding:14px 12px;
    font:inherit;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink);background:transparent;
    transition:background .18s,transform .12s;
  }
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .btn.primary{background:var(--teal);color:#062030;border-color:var(--teal);font-weight:700}
  .btn[disabled]{opacity:.6;cursor:default}

  /* ---- hint ---- */
  .hint{
    margin-top:auto;padding-top:26px;
  }
  .hint div{
    border:1px solid var(--line);border-radius:999px;padding:12px 18px;
    font-size:13px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;
  }
  .hint svg{flex:none}
  .hint span{color:var(--teal)}
  .foot{text-align:center;color:var(--mute);font-size:11px;margin-top:14px;line-height:1.8}

  /* ---- done ---- */
  .done{display:none;text-align:center;padding:48px 0 32px;flex:1}
  .done.show{display:flex;flex-direction:column;justify-content:center;align-items:center}
  .done .mark{
    width:92px;height:92px;border-radius:50%;border:1.5px solid var(--teal);
    display:grid;place-items:center;margin-bottom:22px;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .done h2{font-family:"Noto Serif JP",serif;font-weight:600;font-size:clamp(20px,5.6vw,26px);letter-spacing:.04em;white-space:nowrap}
  .done p{color:var(--mute);margin-top:14px;font-size:14px;line-height:1.9;max-width:34ch}
  .done .picked{
    margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:12px 18px;
    font-size:14px;color:var(--ink)
  }
  .done .picked b{color:var(--teal);font-weight:500;margin-right:8px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="bar">
    <strong>FUJI Wellness Channel</strong>
    <span>店内アナウンスにて放送中</span>
  </header>

  <main id="vote">
    <section class="head">
      <div class="kicker"><i class="l"></i>あなたはどっち派？♪<i class="r"></i></div>
      <h1>今月のセイムタイプ診断</h1>
      <div class="rule"></div>
      <p class="q">
        <b>Q.</b>今月のお題は <span class="nw">“朝活タイプ”</span> か、<span class="nw">“夜活タイプ”</span> か！<br>
        <small>日頃の習慣、直感で1つ選んで投票してください。</small>
      </p>
    </section>

    <div class="choices" role="radiogroup" aria-label="あなたのタイプ">
      <button class="choice" type="button" role="radio" aria-checked="false" data-c="A">
        <span class="tag">A</span>
        <svg class="glyph" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#F2A93B"/></linearGradient></defs>
          <path d="M8 44 H56" stroke="#4ED6E6" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
          <path d="M14 50 H50" stroke="#4ED6E6" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
          <path d="M18 44 A14 14 0 0 1 46 44 Z" fill="url(#sun)"/>
          <g stroke="#F2C15A" stroke-width="2" stroke-linecap="round">
            <path d="M32 14 V20"/><path d="M15 21 L19 25"/><path d="M49 21 L45 25"/><path d="M9 36 H15"/><path d="M49 36 H55"/>
          </g>
        </svg>
        <span>
          <span class="name">朝活タイプ</span>
          <span class="desc">朝スッキリ動くと、一日の調子がいい</span>
        </span>
      </button>

      <button class="choice" type="button" role="radio" aria-checked="false" data-c="B">
        <span class="tag">B</span>
        <svg class="glyph" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E7FF"/><stop offset="1" stop-color="#C98BE0"/></linearGradient></defs>
          <path d="M38 12 A18 18 0 1 0 50 42 A14 14 0 0 1 38 12 Z" fill="url(#moon)"/>
          <g fill="#E58BE0">
            <circle cx="16" cy="18" r="1.4"/><circle cx="12" cy="30" r="1"/><circle cx="22" cy="10" r=".9"/>
            <path d="M53 16 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2z"/>
          </g>
          <path d="M8 52 H56" stroke="#4ED6E6" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
        </svg>
        <span>
          <span class="name">夜活タイプ</span>
          <span class="desc">仕事終わりにひと汗かいて、スッキリしたい</span>
        </span>
      </button>
    </div>

    <div class="confirm" id="confirm">
      <button class="btn" type="button" id="back">選び直す</button>
      <button class="btn primary" type="button" id="send">この内容で投票する</button>
    </div>

    <div class="hint">
      <div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ED6E6" stroke-width="1.6" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 3.5 10.9c-.7.5-1 1.2-1 2.1h-5c0-.9-.3-1.6-1-2.1A6 6 0 0 1 12 3z"/></svg>
        考えすぎず、ピンときた方を選んでね！<span>結果は次回以降の放送で発表！</span>
      </div>
      <p class="foot">お名前や連絡先は取得しません。投票は1端末1回まで。</p>
    </div>
  </main>

  <section class="done" id="done" aria-live="polite">
    <div class="mark">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4ED6E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h2>投票ありがとうございました！</h2>
    <p>結果は次回以降の FUJI Wellness Channel で発表します。<br>多数派のセイムタイプは番組で詳しく掘り下げます。お楽しみに♪</p>
    <div class="picked" id="picked"></div>
  </section>

</div>

<script>
/* =========================================================
   設定：Googleフォームの情報をここに入れる
   ---------------------------------------------------------
   FORM_ACTION : フォームの回答用URLの末尾 /viewform を /formResponse に変えたもの
   ENTRY_CHOICE: 2択質問の entry.xxxxxx（事前入力リンクから取得）
   ENTRY_TOPIC : お題ID用の短文回答の entry.xxxxxx（不要なら "" のまま）
   CHOICES     : value はフォームの選択肢テキストと「完全一致」させる
   ========================================================= */
const CONFIG = {
  FORM_ACTION : "https://docs.google.com/forms/d/e/1FAIpQLSfOq2i83eERaYOzPUgHx4I-NddGrdyS7znMdSltfHEVaYsBJA/formResponse",
  ENTRY_CHOICE: "entry.278386675",
  ENTRY_TOPIC : "",
  TOPIC_ID    : "2026-10",
  CHOICES: {
    A: { label: "朝活タイプ", value: "A 朝活タイプ｜朝スッキリ動くと調子がいい" },
    B: { label: "夜活タイプ", value: "B 夜活タイプ｜仕事終わりにひと汗かいてスッキリしたい" }
  }
};

const $ = s => document.querySelector(s);
const choices = [...document.querySelectorAll(".choice")];
const confirmBox = $("#confirm"), sendBtn = $("#send"), backBtn = $("#back");
const KEY = "seimtype_voted_" + CONFIG.TOPIC_ID;
let selected = null;

function showDone(c){
  $("#vote").hidden = true;
  $("#done").classList.add("show");
  $("#picked").innerHTML = "<b>あなたの投票</b>" + c + "　" + CONFIG.CHOICES[c].label;
}

/* 同一端末で投票済みなら完了画面へ */
try{
  const prev = localStorage.getItem(KEY);
  if (prev && CONFIG.CHOICES[prev]) showDone(prev);
}catch(e){}

choices.forEach(btn => btn.addEventListener("click", () => {
  selected = btn.dataset.c;
  choices.forEach(b => {
    const on = b === btn;
    b.classList.toggle("on", on);
    b.setAttribute("aria-checked", on);
  });
  confirmBox.classList.add("show");
  sendBtn.textContent = CONFIG.CHOICES[selected].label + "に投票する";
  confirmBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
}));

backBtn.addEventListener("click", () => {
  selected = null;
  choices.forEach(b => { b.classList.remove("on"); b.setAttribute("aria-checked", "false"); });
  confirmBox.classList.remove("show");
});

sendBtn.addEventListener("click", async () => {
  if (!selected) return;
  sendBtn.disabled = true; backBtn.disabled = true;
  sendBtn.textContent = "送信中…";

  const body = new URLSearchParams();
  body.append(CONFIG.ENTRY_CHOICE, CONFIG.CHOICES[selected].value);
  if (CONFIG.ENTRY_TOPIC) body.append(CONFIG.ENTRY_TOPIC, CONFIG.TOPIC_ID);

  const configured = !/XXXX/.test(CONFIG.FORM_ACTION);
  if (configured){
    try{
      /* no-cors のため成否は読めない（投げっぱなし）。ほぼ確実に届く */
      await fetch(CONFIG.FORM_ACTION, { method: "POST", mode: "no-cors", body,
        headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    }catch(e){
      /* fetch失敗時は非表示フォームで再送 */
      const f = document.createElement("form");
      f.method = "POST"; f.action = CONFIG.FORM_ACTION; f.target = "sink"; f.style.display = "none";
      for (const [k, v] of body){ const i = document.createElement("input"); i.name = k; i.value = v; f.appendChild(i); }
      const sink = document.createElement("iframe"); sink.name = "sink"; sink.style.display = "none";
      document.body.append(sink, f); f.submit();
    }
  } else {
    console.warn("[seimtype] CONFIG.FORM_ACTION が未設定です（デモ動作）");
  }

  try{ localStorage.setItem(KEY, selected); }catch(e){}
  setTimeout(() => showDone(selected), 350);
});
</script>
</body>
</html>
